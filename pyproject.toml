[project]
name = "tareas"
version = "0.1.0"
description =  "Automatiza tareas repetitivas con ficheros desde la terminal"
readme = "README.md"
authors = [
    { name = "Carolina Bermúdez", email = "bermudezcarolinam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
tareas = "tareas.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
